<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERFUMUM — Graphe anamorphique</title><style>:root{font-family:Arial,sans-serif;color:#eef6ff;background:#07111f}*{box-sizing:border-box}body{margin:0;padding:20px}h1{margin:0 0 10px}.notice{background:#112845;border:1px solid #7698c8;border-radius:8px;padding:10px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.stage{min-height:600px;position:relative;background:#020617;border:1px solid #2c4266;border-radius:10px;overflow:hidden}canvas{width:100%;height:600px;display:block}.panel{background:#0c2038;border:1px solid #2c4266;padding:14px;border-radius:10px}button{background:#8bb7ff;border:0;border-radius:6px;padding:9px;margin:4px 0;display:block;font-weight:bold}.corner{position:absolute;width:18px;height:18px;border:2px solid #ffe081;border-radius:50%;transform:translate(-50%,-50%);touch-action:none;cursor:grab}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #29405e;padding:5px;text-align:left}@media(max-width:800px){.grid{grid-template-columns:1fr}.stage,canvas{min-height:440px;height:440px}}</style></head><body><h1>Graphe anamorphique — lecture seule</h1><p class="notice">Export documentaire embarqué. La projection ne modifie aucune donnée et ne commande aucune matière.</p><div class="grid"><div class="stage" id="stage"><canvas id="c"></canvas><i class="corner"></i><i class="corner"></i><i class="corner"></i><i class="corner"></i></div><aside class="panel"><b id="meta"></b><p>Glissez les quatre poignées pour caler la projection sur une surface stable.</p><button id="reset">Réinitialiser</button><button id="log">Journaliser calibration</button><button id="csv">Télécharger CSV local</button><p><small>Critère : six nœuds et leurs liens restent lisibles après calibration.</small></p><table id="table"></table></aside></div><script>
const DATA={date:'2026-09-15',recipe:'Fleur Fantôme',note:'Données documentaires, sans émission.',m:[['Aldéhyde C-11',194,11],['Aldéhyde C-12',195,11],['Linalol',196,11],['Benzyl acetate',213,11],['Hedione',280,11],['Iso E Super',290,11],['Ambroxan',310,11],['Galaxolide',327,11]]};const c=document.querySelector('#c'),x=c.getContext('2d'),stage=document.querySelector('#stage'),hs=[...document.querySelectorAll('.corner')],events=[];let pts=[[.08,.1],[.92,.08],[.9,.9],[.1,.92]],active=-1;document.querySelector('#meta').textContent=`${DATA.recipe} · ${DATA.m.length} relations · export ${DATA.date}`;document.querySelector('#table').innerHTML='<tr><th>Molécule</th><th>BP</th></tr>'+DATA.m.map(a=>`<tr><td>${a[0]}</td><td>${a[1]} °C</td></tr>`).join('');function p(u,v,w,h){let[a,b,d,e]=pts;return{x:((1-u)*(1-v)*a[0]+u*(1-v)*b[0]+u*v*d[0]+(1-u)*v*e[0])*w,y:((1-u)*(1-v)*a[1]+u*(1-v)*b[1]+u*v*d[1]+(1-u)*v*e[1])*h}}function handles(){let r=stage.getBoundingClientRect();hs.forEach((h,i)=>{h.style.left=pts[i][0]*r.width+'px';h.style.top=pts[i][1]*r.height+'px'})}function draw(){let r=c.getBoundingClientRect(),w=r.width,h=r.height,d=devicePixelRatio;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);x.fillStyle='#020617';x.fillRect(0,0,w,h);let a=p(.5,.5,w,h);x.fillStyle='#ba90ff';x.beginPath();x.arc(a.x,a.y,24,0,7);x.fill();x.fillStyle='#07111f';x.font='bold 12px Arial';x.fillText('Fleur Fantôme',a.x-38,a.y+4);DATA.m.forEach((m,i)=>{let q=p(.12+i*.108,.26+(i%2)*.48,w,h);x.strokeStyle='#6985e8';x.lineWidth=2;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(q.x,q.y);x.stroke();x.fillStyle=`hsl(${190+i*22} 85% 65%)`;x.beginPath();x.arc(q.x,q.y,14,0,7);x.fill();x.fillStyle='#eaf2ff';x.font='12px Arial';x.fillText(m[0]+' · '+m[1]+' °C',q.x+18,q.y+4)});x.fillStyle='#b9c9de';x.font='11px Arial';x.fillText('Export local '+DATA.date+' · visualisation documentaire, sans émission',14,h-16)}hs.forEach((el,i)=>{el.onpointerdown=e=>{active=i;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(active!==i)return;let r=stage.getBoundingClientRect();pts[i]=[Math.max(.01,Math.min(.99,(e.clientX-r.left)/r.width)),Math.max(.01,Math.min(.99,(e.clientY-r.top)/r.height))];handles();draw()};el.onpointerup=()=>active=-1});function dl(){let s='timestamp_utc,event_type,value\n'+events.join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='perfumum-graphe-anamorphique.csv';a.click()}document.querySelector('#reset').onclick=()=>{pts=[[.08,.1],[.92,.08],[.9,.9],[.1,.92]];handles();draw()};document.querySelector('#log').onclick=()=>{events.push(new Date().toISOString()+',calibration,"'+JSON.stringify(pts).replaceAll('"','""')+'"');alert('Calibration ajoutée au CSV local.')};document.querySelector('#csv').onclick=dl;new ResizeObserver(()=>{handles();draw()}).observe(c);handles();draw();</script></body></html>

  <text x="88" y="546" fill="#f1f5f9" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="700">Lecture correcte des indicateurs</text>
  <text x="88" y="578" fill="#c9d8eb" font-family="Noto Sans, Arial, sans-serif" font-size="15">« Non nul » signifie IS NOT NULL. La présence d’un point d’ébullition, d’un radar ou d’un statut IFRA n’évalue ni la validité scientifique, ni l’actualité réglementaire, ni la composition de l’air.</text>
  <text x="88" y="608" fill="#c9d8eb" font-family="Noto Sans, Arial, sans-serif" font-size="15">Les six axes représentent chacun 7 478 valeurs non nulles : intensity, freshness, warmth, sweetness, spiciness et earthiness. La couche /t est détectée textuellement dans InChI.</text>
  <text x="88" y="638" fill="#9fb4cf" font-family="Noto Sans, Arial, sans-serif" font-size="14">Source reproductible : server/scripts/report-data-completeness-installation.sql · Export tabulaire : 2026-09-completude-molecules-2026-09-16.csv</text>

name: CI — PERFUMUM Research

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: Integration Tests (CI database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests when a CI database is configured
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Tests d’intégration ignorés : le secret CI_DATABASE_URL n’est pas configuré."
            echo "Les tests complets restent exécutés dans l’environnement Manus connecté à la base du projet."
            exit 0
          fi
          pnpm test

  build:
    name: Build Client
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production
          # Dummy env vars required by Vite at build time
          VITE_APP_ID: ci-build
          VITE_OAUTH_PORTAL_URL: https://placeholder.test
          VITE_FRONTEND_FORGE_API_KEY: ci-key
          VITE_FRONTEND_FORGE_API_URL: https://placeholder.test
          VITE_APP_TITLE: PERFUMUM
          VITE_APP_LOGO: /logo.svg
